name: Update AI Daily
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fx_only:
        description: 'Only check and publish exchange rates'
        type: boolean
        default: false
  schedule:
    # Every hour at minute 17; GitHub may delay scheduled runs.
    - cron: '17 * * * *'
    # Together with the hourly run above, FX is checked every 30 minutes.
    - cron: '47 * * * *'
    # Following-list sync every 12 hours at 07:43 and 19:43 Beijing.
    - cron: '43 11,23 * * *'

concurrency:
  group: ai-daily-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      FX_ONLY: ${{ github.event.schedule == '47 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.fx_only) }}
    timeout-minutes: 25
    outputs:
      publish: ${{ steps.save.outputs.publish }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test feed processing
        run: python -m unittest discover -s tests -v
      - name: Test custom-domain routing
        run: node --test cloudflare/test_proxy.mjs tests/test_fx_math.cjs
      - name: Sync X following twice daily (opt-in, budget guarded)
        if: env.FX_ONLY != 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '43 11,23 * * *')
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/sync_x_following.py
      - name: Collect publisher feeds
        if: env.FX_ONLY != 'true'
        run: python scripts/collect.py
      - name: Collect official daily exchange rates
        run: python scripts/collect_fx.py
      - name: Decide whether Chinese briefs need refreshing
        id: summaries
        run: |
          if [ "$FX_ONLY" = "true" ]; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" != "push" ] || ! git diff --quiet HEAD^ HEAD -- scripts/summarize.py scripts/summary_utils.py scripts/collect.py sources.json; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v4
        if: steps.summaries.outputs.refresh == 'true'
        with:
          path: .cache/summary
          key: summary-qwen3-4b-instruct-a06e946b-llama-b11788-v3
      - name: Generate Chinese briefs on the runner (no API key)
        if: steps.summaries.outputs.refresh == 'true'
        run: python scripts/summarize.py --limit 64 --max-seconds 540
      - name: Check configured X watchlist
        if: env.FX_ONLY != 'true'
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/collect_x.py
      - name: Build yesterday newspaper and past editions
        if: env.FX_ONLY != 'true'
        run: python scripts/daily_edition.py
      - name: Refresh browser asset versions
        run: python scripts/version_assets.py
      - name: Save history
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/save_history.py
      - uses: actions/upload-pages-artifact@v4
        if: steps.save.outputs.publish == 'true'
        with:
          path: site
  deploy:
    needs: update
    if: needs.update.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
