name: Update AI Daily
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every two hours at minute 17; GitHub may delay scheduled runs.
    - cron: '17 */2 * * *'

concurrency:
  group: ai-daily-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test feed processing
        run: python -m unittest discover -s tests -v
      - name: Collect publisher feeds
        run: python scripts/collect.py
      - uses: actions/cache@v4
        with:
          path: .cache/summary
          key: summary-qwen3-4b-instruct-a06e946b-llama-b11788-v3
      - name: Generate Chinese briefs on the runner (no API key)
        run: python scripts/summarize.py --limit 64 --max-seconds 540
      - name: Check configured X watchlist
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/collect_x.py
      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/feed.xml site/sources.opml
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public AI sources"
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
